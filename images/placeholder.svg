<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4C5B2"/>
      <stop offset="100%" style="stop-color:#C4A882"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="#5C3D2E" opacity="0.05"/>
  <rect width="800" height="600" filter="url(#noise)" opacity="0.3"/>
  <!-- 相机图标（简化） -->
  <g transform="translate(400,240)" opacity="0.35">
    <!-- 机身 -->
    <rect x="-90" y="-55" width="180" height="110" rx="16" fill="#5C3D2E"/>
    <!-- 顶部 -->
    <rect x="-50" y="-75" width="100" height="20" rx="6" fill="#5C3D2E"/>
    <!-- 镜头 -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#5C3D2E" stroke-width="4"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#5C3D2E" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#5C3D2E" opacity="0.3"/>
    <!-- 取景器 -->
    <rect x="50" y="-55" width="26" height="16" rx="4" fill="#5C3D2E"/>
  </g>
  <!-- 文字 -->
  <text x="400" y="380" text-anchor="middle" font-family="serif" font-size="28" fill="#5C3D2E" opacity="0.5">
    慢帧时光
  </text>
  <text x="400" y="415" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5C3D2E" opacity="0.35">
    film camera
  </text>
</svg>
